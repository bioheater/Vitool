<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http: https:; img-src 'self' file: https: data:; media-src 'self' file: https: blob:; style-src 'self'; script-src 'self'"
    />
    <title>Vitool</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/effects.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="shell">
      <nav class="sidebar" aria-label="Bereiche">
        <div class="brand">
          <svg class="brand-mark" viewBox="4 4 72 72" aria-hidden="true">
            <defs>
              <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8b6cff" />
                <stop offset="1" stop-color="#2fc6e8" />
              </linearGradient>
            </defs>
            <rect x="4" y="4" width="72" height="72" rx="20" fill="url(#brand-gradient)" />
            <path d="M22 22 L40 60 L58 22" fill="none" stroke="#0b0e14" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M30.9 21 L49.1 21 L40 40.2 Z" fill="#0b0e14" stroke="#0b0e14" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
          <span class="brand-name">Vitool</span>
        </div>
        <div id="nav" class="nav"></div>
        <div id="nav-bottom" class="nav nav-end"></div>
        <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical"></div>
      </nav>
      <main id="page" class="page"></main>
      <section id="queue" class="queue" aria-label="Warteschlange"></section>
    </div>
    <div id="tools-dialog"></div>
    <script src="../../node_modules/hls.js/dist/hls.light.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
