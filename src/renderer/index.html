<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; media-src 'self' file: https: blob:; style-src 'self'; script-src 'self'"
    />
    <title>Vitool</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/effects.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="shell">
      <nav class="sidebar" aria-label="Bereiche">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3ddc97" />
                <stop offset="0.55" stop-color="#2fc6e8" />
                <stop offset="1" stop-color="#8b6cff" />
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="9" fill="url(#brand-gradient)" />
            <path d="M12 9.5v13l10.5-6.5z" fill="#0b0e14" />
          </svg>
          Vitool
        </div>
        <div id="nav" class="nav"></div>
      </nav>
      <main id="page" class="page"></main>
      <section id="queue" class="queue" aria-label="Warteschlange"></section>
    </div>
    <div id="tools-dialog"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
